[project]
name = "stackcheck"
version = "0.1.0"
description = "Checks RERA quarterly progress reports against the builder's own photos and numbers."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "python-multipart>=0.0.32",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.2",
  "openai>=3.40.0",
  "httpx>=0.28.1",
  "pymupdf>=2.0",
  "pillow>=13.0.0",
  "numpy>=2.5.4",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",
  "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real paid APIs; run only with STACKCHECK_LIVE=1"]
addopts = "-m 'not live'"
